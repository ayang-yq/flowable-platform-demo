version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flowable-postgres
    environment:
      POSTGRES_DB: flowable_platform
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowable123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowable -d flowable_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowable-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowable-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable_platform
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-flowable123}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - flowable-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowable-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flowable-network

volumes:
  postgres_data:

networks:
  flowable-network:
    driver: bridge
