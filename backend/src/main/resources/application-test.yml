spring:
  datasource:
    # Datasource configuration will be provided by TestContainers via @DynamicPropertySource
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springdoc.springdoc-openapi-starter-webmvc-autoconfiguration

flowable:
  database-schema-update: true

logging:
  level:
    com.flowable.platform: DEBUG
    org.flowable: INFO
    org.springframework.security: INFO
    org.testcontainers: INFO
